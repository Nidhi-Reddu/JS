<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React{
        constructor(){
            this.library = "React",
            this.server = "http://localhost:3000"
            // document.querySelector('button').addEventListener('click',this.handleClick)
            document.querySelector('button').addEventListener('click',this.handleClick.bind(this))      // bind the reference of this
        }
        handleClick(){
            console.log("button clicked!")
            console.log(this)
            console.log(this.server)        // not have access to this.server for this we have to manually bind it 
        }

    }
    const temp = new React()
    
</script>
</html>
